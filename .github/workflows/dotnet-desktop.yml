name: Build Desktop App

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Solution
        # 直接编译，不带 /t:Restore（Build会自动恢复），不带 /p:Platform=x64
        run: msbuild ./client/ChisFlashBurner.sln /p:Configuration=Release /v:minimal

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ChisFlashBurner
          # 使用通配符抓取 Release 目录下的所有产物
          path: |
            ./client/**/bin/Release/
            !./client/**/bin/Release/obj/
