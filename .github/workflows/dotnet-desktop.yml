name: Build Desktop App

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        run: msbuild ./client/ChisFlashBurner.sln /t:Restore /p:Configuration=Release

      - name: Build
        run: msbuild ./client/ChisFlashBurner.sln /p:Configuration=Release /p:Platform=x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: |
            **/bin/x64/Release
            **/bin/Release
